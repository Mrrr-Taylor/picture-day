<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Picture timeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e5eff9; --ink:#1f3550; --ink-soft:#5b7491; --btn:#ffffff; --btn-ink:#1f3550;
  --ring:#2d6cb3; --good:#3c78d8; --bad:#c8463c; --shadow:rgba(31,53,80,.22);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#e5eff9; } }
:root[data-theme="dark"]{ --bg:#e5eff9; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Fraunces",Georgia,"Times New Roman",serif;overflow:hidden;
  -webkit-tap-highlight-color:transparent}
.table{height:100%;display:grid;grid-template-rows:1fr auto;padding:clamp(12px,2.5vw,28px)}

/* top: deck + controls */
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:clamp(16px,3vw,36px);min-height:0}
.deck{position:relative;height:min(40vh,420px);aspect-ratio:0.75}
.deck .layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.deck .face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  transition:transform .25s ease}
.deck.empty{border:2px dashed #b4c8de;border-radius:10px}
.deck .face.lift{transform:translateY(-6px) rotate(-1deg)}

.controls{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ctl{border:none;background:none;padding:2px 0;margin:0;color:var(--good);cursor:pointer;text-align:right;
  font-family:"Boldonse","Arial Black",Impact,sans-serif;font-size:clamp(20px,4.4vw,52px);line-height:1.7;
  transform-origin:right center;transition:transform .15s ease,opacity .2s ease}
.ctl:hover:not(:disabled){transform:translateX(-4px)}
.ctl:disabled{opacity:.3;cursor:default}
.ctl:focus-visible,.slot:focus-visible{outline:3px solid var(--ring);outline-offset:3px}
.ctl.call{animation:call 1.6s ease-in-out infinite}
@keyframes call{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

/* bottom: the line */
.lineWrap{overflow-x:auto;overflow-y:hidden;padding:18px 4px 6px;scrollbar-width:thin}
.line{display:flex;align-items:center;width:max-content;margin-inline:auto;min-height:100%}
.card{position:relative;height:min(30vh,320px);aspect-ratio:0.75;flex:none;
  display:flex;flex-direction:column;align-items:center}
.card img{width:100%;height:100%;object-fit:cover;transition:box-shadow .3s ease}
.card.new{animation:drop .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{transform:translateY(-40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.card .year{position:absolute;bottom:-8px;left:50%;transform:translate(-50%,100%);
  font-family:"Boldonse","Arial Black",Impact,sans-serif;font-size:11px;line-height:1.9;white-space:nowrap;padding:4px 0 2px;
  opacity:0;transition:opacity .35s ease}
.revealed .card .year{opacity:1;transition-delay:var(--d)}
.revealed .card.good .year{color:var(--good)}
.revealed .card.bad .year{color:var(--bad)}
.revealed .card.bad img{box-shadow:0 0 0 3px var(--bad)}
.revealed .lineWrap{padding-bottom:44px}

.slot{flex:none;width:44px;height:44px;margin:0 6px;border-radius:50%;border:none;
  background:var(--btn);color:var(--ring);display:grid;place-items:center;cursor:pointer;
  box-shadow:0 2px 6px var(--shadow);transition:transform .15s ease,margin .2s ease,background .15s ease}
.slot svg{width:22px;height:22px}
.slot:hover{transform:translateY(4px);background:var(--ring);color:#fff;margin:0 18px}
.revealed .slot,.done .slot{display:none}
.revealed .card,.done .card{margin:0 6px}

@media (max-width:600px){
  .slot{width:36px;height:36px;margin:0 3px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<main class="table" id="table">
  <div class="top">
    <div class="deck" id="deck" aria-label="Next photo"></div>
    <div class="controls">
      <button class="ctl" id="challenge" aria-label="Challenge: reveal the years" title="Challenge">
        CHALLENGE
      </button>
      <button class="ctl" id="shuffle" aria-label="Shuffle and start a new round" title="New round">
        SHUFFLE
      </button>
    </div>
  </div>
  <div class="lineWrap" id="lineWrap"><div class="line" id="line"></div></div>
</main>

// order: lower number = older. label shown on reveal.
const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v15"/><path d="m6 13 6 6 6-6"/></svg>';
let deck=[], line=[], revealed=false, lastPlaced=null;
const $ = id => document.getElementById(id);

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function newRound(){
  deck = shuffle(CARDS.map((_,i)=>i));
  line = [deck.pop()];
  revealed=false; lastPlaced=line[0];
  render();
}

function place(pos){
  if(revealed||!deck.length) return;
  const id=deck.pop();
  line.splice(pos,0,id);
  lastPlaced=id;
  render();
  // keep the new card in view
  const el=document.querySelector('.card.new');
  if(el) el.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
}

// cards in the longest correctly-ordered run stay green; the rest are out of place
function correctSet(){
  const v=line.map(i=>CARDS[i].order), n=v.length;
  const len=Array(n).fill(1), prev=Array(n).fill(-1);
  for(let i=0;i<n;i++)for(let j=0;j<i;j++)
    if(v[j]<v[i]&&len[j]+1>len[i]){len[i]=len[j]+1;prev[i]=j;}
  let best=0;for(let i=1;i<n;i++) if(len[i]>len[best]) best=i;
  const s=new Set();for(let i=best;i>=0;i=prev[i]) s.add(i);
  return s;
}

function render(){
  const t=$('table');
  t.classList.toggle('revealed',revealed);
  t.classList.toggle('done',!deck.length);

  // deck
  const d=$('deck'); d.innerHTML='';
  d.classList.toggle('empty',!deck.length);
  if(deck.length){
    const layers=Math.min(deck.length-1,4);
    for(let k=layers;k>=1;k--){
      const l=new Image(); l.className='layer'; l.alt=''; l.src=CARDS[deck[deck.length-1-k]].src;
      l.style.transform=`translate(${k*4}px,${k*4}px) rotate(${(k%2?1:-1)*k*0.6}deg)`;
      d.appendChild(l);
    }
    const img=new Image(); img.className='face'; img.alt=''; img.src=CARDS[deck[deck.length-1]].src;
    d.appendChild(img);
  }

  // line
  const L=$('line'); L.innerHTML='';
  const good=revealed?correctSet():null;
  const addSlot=pos=>{
    const b=document.createElement('button'); b.className='slot';
    b.setAttribute('aria-label',`Place photo at position ${pos+1}`);
    b.innerHTML=arrow;
    b.onmouseenter=b.onfocus=()=>{const f=d.querySelector('.face');f&&f.classList.add('lift');};
    b.onmouseleave=b.onblur=()=>{const f=d.querySelector('.face');f&&f.classList.remove('lift');};
    b.onclick=()=>place(pos);
    L.appendChild(b);
  };
  line.forEach((id,i)=>{
    addSlot(i);
    const c=document.createElement('div');
    c.className='card'+(id===lastPlaced&&!revealed?' new':'')+(revealed?(good.has(i)?' good':' bad'):'');
    c.style.setProperty('--d',(i*90)+'ms');
    c.innerHTML=`<img alt="" src="${CARDS[id].src}"><span class="year">${CARDS[id].label}</span>`;
    L.appendChild(c);
  });
  addSlot(line.length);

  // controls
  const ch=$('challenge');
  ch.disabled = revealed || line.length<2;
  $('shuffle').classList.toggle('call',revealed);
}

$('challenge').onclick=()=>{ if(line.length<2||revealed) return; revealed=true; lastPlaced=null; render(); };
$('shuffle').onclick=newRound;
newRound();
</script>
</body>
</html>
